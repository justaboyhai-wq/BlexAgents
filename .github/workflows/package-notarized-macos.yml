name: Recover Apple Developer ID Certificate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: 查找与本地私钥匹配的 Developer ID 证书
    runs-on: macos-14
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      EXPECTED_PUBLIC_KEY_SHA256: FA58323C3E5FFA18A26A5E4305435DC2C898573D3AD69DFC5EEF2E41C1892B8A
    steps:
      - name: 校验读取证书所需 Secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8_BASE64; do
            [[ -n "${!name:-}" ]] || { echo "缺少 GitHub Secret: $name" >&2; exit 1; }
          done

      - name: 从 Apple API 恢复匹配证书
        shell: bash
        run: |
          set -euo pipefail
          recovery_dir="$RUNNER_TEMP/recovery"
          mkdir -p "$recovery_dir"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const base64url = (value) => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({
            alg: 'ES256',
            kid: process.env.APPLE_API_KEY,
            typ: 'JWT',
          }));
          const payload = base64url(JSON.stringify({
            iss: process.env.APPLE_API_ISSUER,
            iat: now - 30,
            exp: now + 600,
            aud: 'appstoreconnect-v1',
          }));
          const signingInput = `${header}.${payload}`;
          const privateKey = Buffer.from(process.env.APPLE_API_KEY_P8_BASE64, 'base64').toString('utf8');
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: privateKey,
            dsaEncoding: 'ieee-p1363',
          }).toString('base64url');
          const token = `${signingInput}.${signature}`;

          const url = new URL('https://api.appstoreconnect.apple.com/v1/certificates');
          url.searchParams.set('filter[certificateType]', 'DEVELOPER_ID_APPLICATION,DEVELOPER_ID_APPLICATION_G2');
          url.searchParams.set('fields[certificates]', 'displayName,certificateType,serialNumber,expirationDate,certificateContent,activated');
          url.searchParams.set('limit', '200');

          (async () => {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) {
              throw new Error(`Apple certificates API returned HTTP ${response.status}`);
            }
            const body = await response.json();
            const expected = process.env.EXPECTED_PUBLIC_KEY_SHA256.toUpperCase();
            const candidates = [];
            let matched = null;

            for (const item of body.data ?? []) {
              const attributes = item.attributes ?? {};
              const encoded = attributes.certificateContent ?? '';
              if (!encoded) continue;
              const certificateBytes = encoded.includes('BEGIN CERTIFICATE')
                ? Buffer.from(encoded)
                : Buffer.from(encoded, 'base64');
              const certificate = new crypto.X509Certificate(certificateBytes);
              const publicKeyDer = certificate.publicKey.export({ type: 'spki', format: 'der' });
              const fingerprint = crypto.createHash('sha256').update(publicKeyDer).digest('hex').toUpperCase();
              const metadata = {
                id: item.id,
                displayName: attributes.displayName,
                certificateType: attributes.certificateType,
                serialNumber: attributes.serialNumber,
                expirationDate: attributes.expirationDate,
                activated: attributes.activated,
                publicKeySha256: fingerprint,
              };
              candidates.push(metadata);
              if (fingerprint === expected) {
                matched = metadata;
                fs.writeFileSync(
                  path.join(process.env.RUNNER_TEMP, 'recovery', 'BlexAgent-Developer-ID.cer'),
                  certificate.raw,
                  { mode: 0o600 },
                );
              }
            }

            const report = { expectedPublicKeySha256: expected, matched, candidates };
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, 'recovery', 'report.json'),
              `${JSON.stringify(report, null, 2)}\n`,
              { mode: 0o600 },
            );
            console.log(matched
              ? `已找到匹配证书：${matched.displayName}`
              : `未找到匹配证书；检查了 ${candidates.length} 个 Developer ID Application 证书`);
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: 上传恢复报告和匹配证书
        uses: actions/upload-artifact@v4
        with:
          name: apple-developer-id-certificate-recovery
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/recovery/
