name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（例如 0.7.2）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 版本与签名凭据预检
    runs-on: ubuntu-latest
    environment: production-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 校验项目文档与法律主体
        run: npm run validate:docs

      - name: 检查开源许可与官方发布法律物料
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').private")" = "true"
          test "$(node -p "require('./package.json').license")" = "Apache-2.0"
          required=(LICENSE NOTICE TRADEMARKS.md THIRD_PARTY_NOTICES.md specs/legal/OFFICIAL_DISTRIBUTION_TERMS.md specs/legal/PRIVACY.md)
          for path in "${required[@]}"; do
            [[ -s "$path" ]] || { echo "官方发布法律物料缺失或为空: $path" >&2; exit 1; }
          done
          if grep -q 'UNKNOWN — manual review required' THIRD_PARTY_NOTICES.md; then
            echo "第三方许可清单仍有未识别项目；完成合规复核后才能正式发布。" >&2
            exit 1
          fi
          if grep -Eq 'Release gate:|registered legal entity|注册法律实体' specs/legal/OFFICIAL_DISTRIBUTION_TERMS.md specs/legal/PRIVACY.md; then
            echo "官方发行版条款/隐私声明仍含发布门禁占位内容；正式发布前必须由法律主体确认并移除。" >&2
            exit 1
          fi

      - id: version
        name: 校验发布版本
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            requested_version="$REQUESTED_VERSION"
          else
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效版本号: $requested_version" >&2
            exit 1
          fi
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "发布版本 $requested_version 与 package.json $package_version 不一致" >&2
            exit 1
          fi
          echo "version=$requested_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$requested_version" >> "$GITHUB_OUTPUT"

      - name: 检查正式签名 Secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            WINDOWS_CERTIFICATE_PFX_BASE64
            WINDOWS_CERTIFICATE_PASSWORD
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_KEY_P8_BASE64
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf '正式发布缺少 GitHub Secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  windows:
    name: Windows x64 · 签名 NSIS
    needs: preflight
    runs-on: windows-2022
    environment: production-release
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_ANALYTICS_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: 导入 Windows 代码签名证书
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'blexagent-release.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows 代码签名证书导入失败' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $certificatePath -Force

      - name: 将证书指纹注入 runner 临时配置
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.windows.certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
          $config.bundle.windows.timestampUrl = 'https://timestamp.digicert.com'
          $config | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8

      - name: 构建并验证 Windows 安装包
        shell: pwsh
        run: ./build_windows.ps1 -NonInteractive -RequireSigning

      - uses: actions/upload-artifact@v4
        with:
          name: BlexAgent-${{ needs.preflight.outputs.version }}-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*portable*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig

  macos:
    name: macOS · 签名与公证 · ARM64 + Intel
    needs: preflight
    runs-on: macos-14
    environment: production-release
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_ANALYTICS_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: 导入 Apple Developer ID 证书
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/blexagent-signing.keychain-db"
          certificate="$RUNNER_TEMP/blexagent-release.p12"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: 准备 App Store Connect 公证密钥
        shell: bash
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: 构建、签名、公证并验证 macOS 安装包
        shell: bash
        run: ./build_macos.sh --ci --arch all

      - name: 拒绝内部测试物料进入正式发布
        shell: bash
        run: |
          set -euo pipefail
          if find src-tauri/target/*-apple-darwin/release/bundle -type f -name 'INTERNAL-*' -print -quit | grep -q .; then
            echo "正式发布目录包含 INTERNAL 测试物料" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BlexAgent-${{ needs.preflight.outputs.version }}-macos
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.sig

  publish:
    name: 创建 GitHub Release
    needs: [preflight, windows, macos]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 生成 SHA-256 校验文件
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: 发布安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: BlexAgent v${{ needs.preflight.outputs.version }}
          body: |
            BlexAgent v${{ needs.preflight.outputs.version }} 正式安装包。

            - Windows：x64 NSIS 安装包
            - macOS：Apple Silicon 与 Intel DMG
            - 所有桌面安装包均经过平台代码签名；macOS 已完成公证
            - `SHA256SUMS.txt` 可用于校验下载文件完整性
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/**
