name: Internal Package · Unsigned macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: INTERNAL ONLY · macOS unsigned · ARM64 + Intel
    runs-on: macos-14
    env:
      VITE_ANALYTICS_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Prepare bundled Blex workspace
        run: |
          git clone --depth 1 https://github.com/hAcKlyc/openmino.git mino
          rm -rf mino/.git
          npm run brand:default-workspace
          node scripts/validate-bundled-resources.mjs
      - name: Build complete unsigned DMGs
        run: ./build_macos.sh --ci --unsigned --arch all
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-UNSIGNED-BlexAgent-macOS
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
