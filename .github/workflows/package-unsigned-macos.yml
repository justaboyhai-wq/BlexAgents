name: Package Unsigned macOS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/release-0.7.1
    paths:
      - build_macos.sh
      - .github/workflows/package-unsigned-macos.yml

permissions:
  contents: read

jobs:
  macos:
    name: macOS unsigned · ARM64 + Intel
    runs-on: macos-14
    env:
      VITE_ANALYTICS_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build complete unsigned DMGs
        run: ./build_macos.sh --ci --unsigned --arch all
      - uses: actions/upload-artifact@v4
        with:
          name: BlexAgent-unsigned-macos
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
